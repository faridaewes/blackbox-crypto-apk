name: BLACKBOX Android Release APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create/update GitHub Release and attach the APK"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-android-release:
    name: Build Signed BLACKBOX Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BLACKBOX_API_BASE_URL: ${{ secrets.BLACKBOX_API_BASE_URL }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate production configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "${BLACKBOX_API_BASE_URL:-}" || {
            echo "ERROR: Missing BLACKBOX_API_BASE_URL"
            exit 1
          }

          [[ "$BLACKBOX_API_BASE_URL" == https://* ]] || {
            echo "ERROR: BLACKBOX_API_BASE_URL must use HTTPS"
            exit 1
          }

          test -n "${ANDROID_SIGNING_STORE_PASSWORD:-}" || {
            echo "ERROR: Missing ANDROID_SIGNING_STORE_PASSWORD"
            exit 1
          }

          test -n "${ANDROID_SIGNING_KEY_ALIAS:-}" || {
            echo "ERROR: Missing ANDROID_SIGNING_KEY_ALIAS"
            exit 1
          }

          test -n "${ANDROID_SIGNING_KEY_PASSWORD:-}" || {
            echo "ERROR: Missing ANDROID_SIGNING_KEY_PASSWORD"
            exit 1
          }

          test -n "${ANDROID_KEYSTORE_BASE64:-}" || {
            echo "ERROR: Missing ANDROID_KEYSTORE_BASE64"
            exit 1
          }

          echo "Production configuration detected."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found at:"
            echo "$SDKMANAGER"
            find "$ANDROID_SDK_ROOT" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Using sdkmanager:"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK 35 configured successfully."

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-provider: basic

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          set -euo pipefail

          gradle wrapper \
            --gradle-version 8.11.1 \
            --distribution-type bin

          chmod +x gradlew

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/blackbox-release.jks"

          test -s "$RUNNER_TEMP/blackbox-release.jks"

          echo "Release keystore restored."

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/blackbox-release.jks
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease \
            -PblackboxApiBaseUrl="$BLACKBOX_API_BASE_URL"

      - name: Prepare production APK
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_APK="android/app/build/outputs/apk/release/app-release.apk"
          FINAL_APK="BLACKBOX-Crypto-Android.apk"

          test -f "$SOURCE_APK"

          cp "$SOURCE_APK" "$FINAL_APK"

          sha256sum "$FINAL_APK" \
            | tee "BLACKBOX-Crypto-Android.apk.sha256"

          ls -lh "$FINAL_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLACKBOX-Crypto-Android-v6.4.2
          path: |
            BLACKBOX-Crypto-Android.apk
            BLACKBOX-Crypto-Android.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v6.4.2
          name: BLACKBOX Crypto Android v6.4.2
          generate_release_notes: true
          files: |
            BLACKBOX-Crypto-Android.apk
            BLACKBOX-Crypto-Android.apk.sha256

      - name: Remove temporary signing material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/blackbox-release.jks"
